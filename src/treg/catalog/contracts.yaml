# Capability CONTRACTS — the canonical request/response shape of a first-party routed endpoint
# (`treg.<capability>`), docs/context/architecture/catalog.md § Routing.
#
# A contract is deliberately small: one-of IDENTITY variants (which keys name the subject — never
# provider names), a few shared filters, and a small OUTPUT core every adapter must fill when the
# provider has it. Everything else the provider returns rides in `raw`, which is always present.
# `miss` says, in canonical terms, what "asked and answered: nothing" looks like — it drives the
# opt-in waterfall and the hit-rate statistics.
#
# Only capabilities listed here get a routed endpoint; the endpoint is GENERATED at catalog load
# from the children whose adapters (adapters.yaml) round-trip their fixtures — never hand-written.

contracts:
  people.email.find:
    summary: "Find someone's work email — treg picks the provider (own keys first, then cheapest per hit) and tells you which one served"
    identity:
      - {full_name: str, domain: str}
      - {first_name: str, last_name: str, domain: str}
      - {linkedin_url: url}
      - {linkedin_handle: str}
    # `full_name` ⇄ `first_name`+`last_name` and `linkedin_url` ⇄ `linkedin_handle` are derived from
    # each other, so a caller may send whatever it holds; every provider gets only the fields it wants.
    derive:
      full_name: "join(first_name, last_name)"
      first_name: "split_first(full_name)"
      last_name: "split_last(full_name)"
      linkedin_url: "linkedin_url(linkedin_handle)"
      linkedin_handle: "linkedin_handle(linkedin_url)"
    filters: {}
    output:
      email: {type: str, required: true}
      confidence: {type: float, note: "0..1 — provider scales mapped; the original rides in raw"}
      first_name: {type: str}
      last_name: {type: str}
      verified: {type: bool, note: "the provider says it checked the mailbox"}
    miss: "email == null"
    idempotent: true            # a lookup — error-fallback to the next provider is safe

  # ---- batch 1: social lookups (2026-08-28) ---------------------------------------------------
  instagram.user.profile:
    summary: "Get an Instagram user's public profile — treg picks the provider (own keys first, then cheapest) and names the one that served"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      username: {type: str, required: true}
      user_id: {type: str}
      full_name: {type: str}
      followers: {type: int}
      following: {type: int}
      posts_count: {type: int}
      is_verified: {type: bool}
      is_private: {type: bool}
      biography: {type: str}
    miss: "username == null"
    idempotent: true

  instagram.hashtag.posts:
    summary: "List recent posts under an Instagram hashtag — provider-native post objects in `posts`"
    identity:
      - {hashtag: str}
    filters: {}
    output:
      posts: {type: list, required: true, note: "the provider's own post objects — shapes differ per provider; raw is the same body"}
      count: {type: int}
      next_cursor: {type: str}
    miss: "posts == []"
    idempotent: true

  x.user.posts:
    summary: "List an X (Twitter) user's recent posts — provider-native post objects in `posts`"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      posts: {type: list, required: true, note: "the provider's own tweet objects; raw is the same body"}
      next_cursor: {type: str}
    miss: "posts == []"
    idempotent: true

  tiktok.user.profile:
    summary: "Get a TikTok user's public profile — treg picks the provider (own keys first, then cheapest) and names the one that served"
    identity:
      - {username: str}
      - {user_id: str}
      - {sec_uid: str}
    filters: {}
    output:
      username: {type: str, required: true}
      user_id: {type: str}
      sec_uid: {type: str}
      nickname: {type: str}
      followers: {type: int}
      following: {type: int}
      likes: {type: int}
      videos_count: {type: int}
      is_verified: {type: bool}
      biography: {type: str}
    miss: "username == null"
    idempotent: true

  # ---- batch 2: people, lookup-shaped (2026-08-28) --------------------------------------------
  people.phone.find:
    summary: "Find someone's phone number — treg picks the provider (own keys first, then cheapest per hit) and names the one that served"
    identity:
      - {linkedin_url: url}
      - {email: str}
      - {full_name: str, domain: str}
      - {first_name: str, last_name: str, domain: str}
    derive:
      full_name: "join(first_name, last_name)"
      first_name: "split_first(full_name)"
      last_name: "split_last(full_name)"
      domain: "email_domain(email)"
      linkedin_url: "linkedin_url(linkedin_handle)"
      linkedin_handle: "linkedin_handle(linkedin_url)"
    filters: {}
    output:
      phone: {type: str, required: true, note: "as the provider formats it; E.164 when it offers one"}
      line_type: {type: str}
      country_code: {type: str}
    miss: "phone == null"
    idempotent: true

  people.email.verify:
    summary: "Verify an email address — treg picks the provider (own keys first, then cheapest) and names the one that served"
    identity:
      - {email: str}
    filters: {}
    output:
      valid: {type: bool, required: true, note: "the provider says the mailbox accepts mail"}
      status: {type: str, note: "the provider's own verdict word (valid | invalid | accept_all | unknown | …)"}
      score: {type: int}
    miss: "status == null"
    idempotent: true

  people.enrich:
    summary: "Enrich a person from an email, a LinkedIn URL or a name + company domain — treg picks the provider and names the one that served"
    identity:
      - {email: str}
      - {linkedin_url: url}
      - {linkedin_handle: str}
      - {full_name: str, domain: str}
      - {first_name: str, last_name: str, domain: str}
    derive:
      full_name: "join(first_name, last_name)"
      first_name: "split_first(full_name)"
      last_name: "split_last(full_name)"
      domain: "email_domain(email)"
      linkedin_url: "linkedin_url(linkedin_handle)"
      linkedin_handle: "linkedin_handle(linkedin_url)"
    filters: {}
    output:
      full_name: {type: str, required: true}
      first_name: {type: str}
      last_name: {type: str}
      title: {type: str}
      company: {type: str}
      company_domain: {type: str}
      linkedin_url: {type: str}
      location: {type: str}
    miss: "full_name == null"
    idempotent: true

  # ---- batch 3: social + keywords (2026-08-28) ------------------------------------------------
  instagram.user.posts:
    summary: "List an Instagram user's recent posts — provider-native post objects in `posts`"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      posts: {type: list, required: true, note: "the provider's own post objects; raw is the same body"}
      next_cursor: {type: str}
    miss: "posts == []"
    idempotent: true

  instagram.post.detail:
    summary: "Get an Instagram post's content & stats from its shortcode, URL or id"
    identity:
      - {shortcode: str}
      - {url: url}
      - {post_id: str}
    filters: {}
    output:
      id: {type: str, required: true}
      shortcode: {type: str}
      caption: {type: str}
      likes: {type: int}
      comments: {type: int}
      owner_username: {type: str}
    miss: "id == null"
    idempotent: true

  x.user.profile:
    summary: "Get an X (Twitter) user's public profile — treg picks the provider and names the one that served"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      username: {type: str, required: true}
      user_id: {type: str}
      name: {type: str}
      followers: {type: int}
      following: {type: int}
      posts_count: {type: int}
      is_verified: {type: bool}
      description: {type: str}
    miss: "username == null"
    idempotent: true

  google.keywords.ideas:
    summary: "Related keyword ideas for a seed keyword — provider-native rows in `keywords`; `limit` is the price dial"
    identity:
      - {keyword: str}
    filters:
      country: {type: str, default: us, note: "ISO country code (us, gb, de, …); mapped to each provider's own database code"}
      language: {type: str, default: en}
      limit: {type: int, default: 20, note: "rows to return where the provider bills per row"}
    output:
      keywords: {type: list, required: true, note: "the provider's own keyword rows (keyword, volume, cpc, …) — shapes differ per provider"}
      count: {type: int}
    miss: "keywords == []"
    idempotent: true

  # ---- batch 4 (2026-08-28) -------------------------------------------------------------------
  google.serp.organic:
    summary: "Google organic results for a keyword — provider-native result rows in `results`; `limit` is the depth"
    identity:
      - {q: str}
    filters:
      country: {type: str, default: us, note: "ISO country code; mapped to each provider's location code / gl / region"}
      language: {type: str, default: en}
      limit: {type: int, default: 10, note: "results to return where the provider bills by depth"}
    output:
      results: {type: list, required: true, note: "the provider's own organic result rows (title, link/url, snippet…) — shapes differ per provider"}
      count: {type: int}
    miss: "results == []"
    idempotent: true

  people.search:
    summary: "Find people by a free-text description, or by company domain / title / country — provider-native rows in `people`"
    identity:
      - {q: str}
      - {company_domain: str}
      - {title: str, company_domain: str}
      - {title: str}
    filters:
      country: {type: str, default: null, note: "ISO country code, where the provider supports it"}
      limit: {type: int, default: 10, note: "rows to return — THE price dial: most providers bill per row"}
    output:
      people: {type: list, required: true, note: "the provider's own people rows (name, title, profile url, location…) — shapes differ per provider; raw is the same body"}
      count: {type: int}
      next_cursor: {type: str}
    miss: "people == []"
    idempotent: true

  # ---- batch 5: company enrichment (2026-08-28) -----------------------------------------------
  companies.enrich:
    summary: "Enrich a company from its domain, name, LinkedIn URL or a work email — treg picks the provider and names the one that served"
    identity:
      - {domain: str}
      - {website: url}
      - {name: str}
      - {linkedin_url: url}
      - {linkedin_handle: str}
      - {email: str}
    derive:
      domain: "coalesce(email_domain(email), host(website))"
      linkedin_url: "linkedin_url(linkedin_handle)"
      linkedin_handle: "linkedin_handle(linkedin_url)"
    filters: {}
    output:
      name: {type: str, required: true}
      domain: {type: str}
      website: {type: str}
      description: {type: str}
      industry: {type: str}
      employees: {type: str, note: "headcount or a range, as the provider states it"}
      founded: {type: int}
      location: {type: str}
      linkedin_url: {type: str}
    miss: "name == null"
    idempotent: true
