# Capability CONTRACTS — the canonical request/response shape of a first-party routed endpoint
# (`treg.<capability>`), docs/context/architecture/catalog.md § Routing.
#
# A contract is deliberately small: one-of IDENTITY variants (which keys name the subject — never
# provider names), a few shared filters, and a small OUTPUT core every adapter must fill when the
# provider has it. Everything else the provider returns rides in `raw`, which is always present.
# `miss` says, in canonical terms, what "asked and answered: nothing" looks like — it drives the
# opt-in waterfall and the hit-rate statistics.
#
# Only capabilities listed here get a routed endpoint; the endpoint is GENERATED at catalog load
# from the children whose adapters (adapters.yaml) round-trip their fixtures — never hand-written.

contracts:
  people.email.find:
    summary: "Find someone's work email — treg picks the provider (own keys first, then cheapest per hit) and tells you which one served"
    identity:
      - {full_name: str, domain: str}
      - {first_name: str, last_name: str, domain: str}
      - {linkedin_url: url}
    # `full_name` ⇄ `first_name`+`last_name` are derived from each other, so the two name variants
    # match the same adapters; `linkedin_url` is a different subject and never crosses.
    derive:
      full_name: "join(first_name, last_name)"
      first_name: "split_first(full_name)"
      last_name: "split_last(full_name)"
    filters: {}
    output:
      email: {type: str, required: true}
      confidence: {type: float, note: "0..1 — provider scales mapped; the original rides in raw"}
      first_name: {type: str}
      last_name: {type: str}
      verified: {type: bool, note: "the provider says it checked the mailbox"}
    miss: "email == null"
    idempotent: true            # a lookup — error-fallback to the next provider is safe

  # ---- batch 1: social lookups (2026-08-28) ---------------------------------------------------
  instagram.user.profile:
    summary: "Get an Instagram user's public profile — treg picks the provider (own keys first, then cheapest) and names the one that served"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      username: {type: str, required: true}
      user_id: {type: str}
      full_name: {type: str}
      followers: {type: int}
      following: {type: int}
      posts_count: {type: int}
      is_verified: {type: bool}
      is_private: {type: bool}
      biography: {type: str}
    miss: "username == null"
    idempotent: true

  instagram.hashtag.posts:
    summary: "List recent posts under an Instagram hashtag — provider-native post objects in `posts`"
    identity:
      - {hashtag: str}
    filters: {}
    output:
      posts: {type: list, required: true, note: "the provider's own post objects — shapes differ per provider; raw is the same body"}
      count: {type: int}
      next_cursor: {type: str}
    miss: "posts == []"
    idempotent: true

  x.user.posts:
    summary: "List an X (Twitter) user's recent posts — provider-native post objects in `posts`"
    identity:
      - {username: str}
      - {user_id: str}
    filters: {}
    output:
      posts: {type: list, required: true, note: "the provider's own tweet objects; raw is the same body"}
      next_cursor: {type: str}
    miss: "posts == []"
    idempotent: true

  tiktok.user.profile:
    summary: "Get a TikTok user's public profile — treg picks the provider (own keys first, then cheapest) and names the one that served"
    identity:
      - {username: str}
      - {user_id: str}
      - {sec_uid: str}
    filters: {}
    output:
      username: {type: str, required: true}
      user_id: {type: str}
      sec_uid: {type: str}
      nickname: {type: str}
      followers: {type: int}
      following: {type: int}
      likes: {type: int}
      videos_count: {type: int}
      is_verified: {type: bool}
      biography: {type: str}
    miss: "username == null"
    idempotent: true
