    out: {username: data.userInfo.user.uniqueId, user_id: data.userInfo.user.id, sec_uid: data.userInfo.user.secUid,
          nickname: data.userInfo.user.nickname, followers: data.userInfo.stats.followerCount,
          following: data.userInfo.stats.followingCount, likes: data.userInfo.stats.heartCount,
          videos_count: data.userInfo.stats.videoCount, is_verified: data.userInfo.user.verified,
          biography: data.userInfo.user.signature}
