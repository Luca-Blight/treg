  # ---- instagram.hashtag.posts --------------------------------------------------------------
  # tikhub.x.instagram-v1-fetch-hashtag-posts: no adapter — its captured example truncates the
  # `edge_hashtag_to_media` edges, so `out` cannot be fixture-verified; still callable via /call/.
  tikhub.x.instagram-v2-fetch-hashtag-posts:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.keyword}
    out: {posts: data.data.items, count: data.data.count, next_cursor: data.pagination_token}
    miss: "data.data.items == []"
  scrapecreators.x.v1-instagram-search-hashtag:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: posts, count: "len(posts)", next_cursor: cursor}
    miss: "posts == []"
  justoneapi.x.instagram-search-hashtag-posts-v1:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: data.data.hashtag.edge_hashtag_to_media.edges, count: data.data.hashtag.edge_hashtag_to_media.count,
          next_cursor: data.data.hashtag.edge_hashtag_to_media.page_info.end_cursor}
    miss: "data.data.hashtag == null"

