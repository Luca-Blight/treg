# ADAPTERS — one per endpoint, data-first: how a contract request becomes this provider's request
# (`in`), how the provider's body becomes the contract's core output (`out`), and what a miss
# looks like (`miss`). A tiny expression language, evaluated by domain/catalog/routing/paths.py:
#   paths        data.email · emails[0].email · output.profile.emails[0].email
#   coalesce     coalesce(a.b, c.d)
#   arithmetic   data.score / 100
#   predicates   x == null · x != null · x == [] · x == 'literal'
#   named        split_first(full_name) · join(a, b) · has_type(emails, 'work')
# `accepts` lists the contract identity variants (by their keys) this endpoint can serve.
#
# Every adapter is VERIFIED at catalog load against the endpoint's `test_request` (in) and its
# captured `example_response` (out): one that cannot round-trip its fixture does not become a
# router candidate — the endpoint stays callable via /call/ exactly as before. See
# domain/catalog/routing/adapters.py::verify.

adapters:
  # ---- people.email.find --------------------------------------------------------------------
  hunter.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: queryParams.full_name, domain: queryParams.domain}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  leadmagic.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: body.full_name, domain: body.domain}
    out: {email: email, first_name: first_name, last_name: last_name, verified: "status == 'valid'"}
    miss: "email == null"
  leadsforge.people.email.find:
    accepts: [[first_name, last_name, domain], [full_name, domain], [linkedin_url]]
    in:  {first_name: body.firstName, last_name: body.lastName, domain: body.companyDomain,
          linkedin_url: body.linkedinURL}
    out: {email: email, verified: "status == 'succeeded'"}
    miss: "email == null"
  findymail.search.name:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: body.name, domain: body.domain}
    out: {email: contact.email, first_name: "split_first(contact.name)", last_name: "split_last(contact.name)"}
    miss: "contact.email == null"
  findymail.search.business-profile:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedin_url}
    out: {email: contact.email, first_name: "split_first(contact.name)", last_name: "split_last(contact.name)"}
    miss: "contact.email == null"
  tomba.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: queryParams.full_name, domain: queryParams.domain}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  tomba.people.email.find.linkedin:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.url}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  aviato.people.email.find:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.linkedinURL}
    const: {queryParams.type: work}
    out: {email: "emails[0].email"}
    miss: "emails == []"
  fiber-ai.people.contacts.reveal:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedinUrl}
    const: {body.enrichmentType: {getWorkEmails: true, getPersonalEmails: false, getPhoneNumbers: false},
            body.validateEmails: true}
    out: {email: "output.profile.emails[0].email", verified: "output.profile.success == true"}
    miss: "output.profile.emails == []"

  # ---- instagram.user.profile ---------------------------------------------------------------
  tikhub.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: "coalesce(data.data.user.username, params.username)", user_id: data.data.user.id,
          full_name: data.data.user.full_name, followers: data.data.user.edge_followed_by.count,
          following: data.data.user.edge_follow.count, posts_count: data.data.user.edge_owner_to_timeline_media.count,
          is_verified: data.data.user.is_verified, is_private: data.data.user.is_private, biography: data.data.user.biography}
    miss: "data.data.user == null"
  tikhub.x.instagram-v1-fetch-user-info-by-username-v2:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-username-v3:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-id:
    accepts: [[user_id]]
    in:  {user_id: queryParams.user_id}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-id-v2:
    accepts: [[user_id]]
    in:  {user_id: queryParams.user_id}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v3-get-user-profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.follower_count,
          following: data.following_count, posts_count: data.media_count, is_verified: data.is_verified,
          is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  justoneapi.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  scrapecreators.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.handle}
    out: {username: data.user.username, user_id: data.user.pk, full_name: data.user.full_name,
          followers: data.user.follower_count, following: data.user.following_count, posts_count: data.user.media_count,
          is_verified: data.user.is_verified, is_private: data.user.is_private, biography: data.user.biography}
    miss: "data.user.username == null"
  scrapecreators.x.v1-instagram-basic-profile:
    accepts: [[user_id]]
    in:  {user_id: queryParams.userId}
    out: {username: username, user_id: pk, full_name: full_name, followers: follower_count, following: following_count,
          posts_count: media_count, is_verified: is_verified, is_private: is_private, biography: biography}
    miss: "username == null"
  serpapi.x.instagram-profile:
    accepts: [[username]]
    in:  {username: queryParams.profile_id}
    const: {queryParams.engine: instagram_profile}
    out: {username: search_parameters.profile_id, full_name: full_name, followers: followers, following: following,
          posts_count: posts_count, is_verified: is_verified, biography: biography}
    miss: "error != null"

  # ---- instagram.hashtag.posts --------------------------------------------------------------
  # tikhub.x.instagram-v1-fetch-hashtag-posts: no adapter — its captured example truncates the
  # `edge_hashtag_to_media` edges, so `out` cannot be fixture-verified; still callable via /call/.
  tikhub.x.instagram-v2-fetch-hashtag-posts:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.keyword}
    out: {posts: data.data.items, count: data.data.count, next_cursor: data.pagination_token}
    miss: "data.data.items == []"
  scrapecreators.x.v1-instagram-search-hashtag:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: posts, count: "len(posts)", next_cursor: cursor}
    miss: "posts == []"
  justoneapi.x.instagram-search-hashtag-posts-v1:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: data.data.hashtag.edge_hashtag_to_media.edges, count: data.data.hashtag.edge_hashtag_to_media.count,
          next_cursor: data.data.hashtag.edge_hashtag_to_media.page_info.end_cursor}
    miss: "data.data.hashtag == null"

  # ---- x.user.posts -------------------------------------------------------------------------
  tikhub.x.user.posts:
    accepts: [[username], [user_id]]
    in:  {username: queryParams.screen_name, user_id: queryParams.rest_id}
    out: {posts: data.timeline, next_cursor: data.next_cursor}
    miss: "data.timeline == []"
  scrapecreators.x.user.posts:
    accepts: [[username]]
    in:  {username: queryParams.handle}
    out: {posts: tweets}
    miss: "tweets == []"
  justoneapi.x.twitter-get-user-posts-v1:
    accepts: [[user_id]]
    in:  {user_id: queryParams.restId}
    out: {posts: data.timeline, next_cursor: data.next_cursor}
    miss: "data.timeline == []"

