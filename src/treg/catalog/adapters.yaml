  # ---- google.keywords.ideas ----------------------------------------------------------------
  dataforseo.google.keywords.ideas:
    accepts: [[keyword]]
    in:  {keyword: body.keyword}
    in_expr: {body.location_code: "dfs_location(country)", body.language_code: language, body.limit: limit}
    body_array: true
    out: {keywords: "tasks[0].result[0].items", count: "tasks[0].result[0].total_count"}
    miss: "tasks[0].result[0].items == []"
  seranking.google.keywords.ideas:
    accepts: [[keyword]]
    in:  {keyword: queryParams.keyword}
    in_expr: {queryParams.source: "seranking_source(country)", queryParams.limit: limit}
    out: {keywords: keywords, count: total}
    miss: "keywords == []"
  serpapi.google.keywords.ideas:
    accepts: [[keyword]]
    in:  {keyword: queryParams.q}
    in_expr: {queryParams.gl: "lower(country)", queryParams.hl: language}
    const: {queryParams.engine: google_autocomplete}
    out: {keywords: suggestions, count: "len(suggestions)"}
    miss: "suggestions == []"
