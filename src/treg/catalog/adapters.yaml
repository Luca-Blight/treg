  # ---- people.email.verify ------------------------------------------------------------------
  leadmagic.people.email.verify:
    accepts: [[email]]
    in:  {email: body.email}
    out: {valid: "email_status == 'valid'", status: email_status}
    miss: "email_status == null"
  tomba.people.email.verify:
    accepts: [[email]]
    in:  {email: pathParams.email}
    out: {valid: "data.email.status == 'valid'", status: data.email.status, score: data.email.score}
    miss: "data.email.status == null"
  hunter.people.email.verify:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {valid: "data.status == 'valid'", status: data.status, score: data.score}
    miss: "data.status == null"

  # ---- people.enrich ------------------------------------------------------------------------
  tomba.people.enrich:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {full_name: data.full_name, first_name: data.first_name, last_name: data.last_name, title: data.position,
          company: data.company, company_domain: data.website_url, linkedin_url: data.linkedin, location: data.country}
    miss: "data.full_name == null"
  hunter.people.enrich:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {full_name: data.name.fullName, first_name: data.name.givenName, last_name: data.name.familyName,
          title: data.employment.title, company: data.employment.name, company_domain: data.employment.domain,
          linkedin_url: data.linkedin.handle, location: "coalesce(data.location, data.geo.country)"}
    miss: "data.name.fullName == null"
  # hunter.x.combined-find: no adapter — its captured example truncates data.person.name, so `out`
  # cannot be fixture-verified; hunter.people.enrich covers the same identity.
  leadmagic.people.enrich:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.profile_url}
    out: {full_name: full_name, first_name: first_name, last_name: last_name, title: professional_title,
          company: company_name, company_domain: company_website, linkedin_url: profile_url, location: location}
    miss: "full_name == null"
  icypeas.people.enrich:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.url}
    out: {full_name: "join(result.firstname, result.lastname)", first_name: result.firstname, last_name: result.lastname,
          title: result.headline, company: "result.worksFor[0].name", linkedin_url: result.url,
          location: result.address.addressLocality}
    miss: "result == null"
  pdl.people.enrich:
    accepts: [[email], [linkedin_url], [full_name, domain]]
    in:  {email: queryParams.email, linkedin_url: queryParams.profile, full_name: queryParams.name, domain: queryParams.company}
    out: {full_name: data.full_name, first_name: data.first_name, last_name: data.last_name, title: data.job_title,
          company: data.job_company_name, company_domain: data.job_company_website, linkedin_url: data.linkedin_url,
          location: data.location_name}
    miss: "data.full_name == null"
  companyenrich.people.lookup:
