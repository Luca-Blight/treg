    in:  {email: body.email}
    out: {full_name: name, first_name: first_name, last_name: last_name, title: position,
          linkedin_url: socials.linkedin_url, location: location.address}
    miss: "name == null"
  aviato.people.enrich:
    accepts: [[linkedin_url], [email]]
    in:  {linkedin_url: queryParams.linkedinURL, email: queryParams.email}
    out: {full_name: fullName, linkedin_url: URLs.linkedin}
    miss: "fullName == null"

