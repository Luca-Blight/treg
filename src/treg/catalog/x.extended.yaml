# x — EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries carry no
# capability, no verification and no example response — that is what the core
# x.yaml is for. Routes already curated there are excluded here.
# 
# Source: X's own OpenAPI document for the v2 API (api.twitter.com/2/openapi.json — the
# api.x.com host serves the same API). Its declared server is https://api.x.com, which is
# exactly OAuthProvider.base_url, so every path here is already relative to it.
# 
# SCOPE GAPS ARE THE STORY. treg's X app requests only offline.access, tweet.read, tweet.write, users.read;
# 91 of these routes need something else — likes, follows, lists, spaces, bookmarks, mutes,
# blocks, DMs and media upload each have their own scope. They are listed with `scope_gap:`
# rather than omitted, because that list IS the decision of which scopes to add to the app.
# 
# Beyond scopes, most v2 routes are gated by the ACCESS TIER of the X developer plan (Free
# posts only; Basic/Pro unlock search and timelines) — the spec cannot express that, so a
# listed route may still answer 403 on a Free project.
# 
# scope: GET routes that read public data are `any_account`; writes and anything touching
# /me, DMs, bookmarks, blocks, mutes, compliance or usage are `own_account`.

provider: x
source:
  method: official openapi
  ingested: '2026-07-28'
  spec_urls:
  - https://api.twitter.com/2/openapi.json
