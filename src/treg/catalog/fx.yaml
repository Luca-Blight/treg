# FX rates for unified-USD display of catalog costs. Source of truth for a cost stays in the
# provider's BILLING currency (that is what the provider charges and what stays correct); the
# server converts to USD at serve time with these rates, so a rate refresh instantly re-prices
# every displayed cost without touching provider files.
# Refresh: `uv run python scripts/catalog_fx_update.py` (open.er-api.com, free, no key).
#
# Credit -> USD rates for endpoints priced in provider credits. A "credit" is a
# PROVIDER-SCOPED unit, never a currency: one scrapecreators credit and one lusha credit
# have nothing to do with each other, so each service gets its own rate. Each rate is the
# cheapest PUBLICLY listed entry tier (plan price / credits included) unless the basis says
# otherwise -- real spend on a bigger tier is lower, so these are upper bounds. `usd: null`
# means the provider publishes no per-credit price (seat-based, negotiated, or not credit
# priced at all); those endpoints display credits instead of dollars, never a guessed USD.
# Hand-maintained: re-check the source URLs periodically and bump `checked`.
# NOTE: this block must stay ABOVE `rates_to_usd:` -- catalog_fx_update.py rewrites the file
# from the text before that key, so anything below it is discarded on the next FX refresh.
credit_rates_usd:
  scrapecreators: {usd: 0.00188, basis: "Freelance pay-as-you-go $47 / 25,000 credits (Business tier is $497 / 500,000 = $0.000994)", source: "https://scrapecreators.com/", checked: "2026-07-28"}
  leadmagic: {usd: 0.025, basis: "Basic $49.99/mo / 2,000 credits per month (annual billing $490/yr / 24,000 = $0.0204)", source: "https://leadmagic.io/pricing", checked: "2026-07-28"}
  hunter: {usd: 0.0245, basis: "Starter $49/mo / 2,000 credits; one shared pool -- a search costs 1 credit, a verification 0.5 credit, so verification effectively $0.0123", source: "https://hunter.io/pricing", checked: "2026-07-28"}
  diffbot: {usd: 0.001196, basis: "Startup $299/mo / 250,000 credits", source: "https://www.diffbot.com/pricing/", checked: "2026-07-28"}
  lusha: {usd: 0.1248, basis: "Starter $49.90/mo / 400 credits (email reveal = 1 credit, phone reveal = 10). GET /v3/account/usage returns a free pricing object of per-action credit COUNTS, not dollars -- multiply those counts by this rate", source: "https://www.lusha.com/pricing/", checked: "2026-07-28"}
  akta: {usd: 0.05, basis: "pay-as-you-go $0.05/credit as stated in docs ($0.04 on subscription)", source: "https://docs.akta.pro/getting-started/pricing", checked: "2026-07-28"}
  coresignal: {usd: 0.0196, basis: "Mini $49/mo / 2,500 credits (Growth tier is listed at $0.007/credit)", source: "https://coresignal.com/pricing/", checked: "2026-07-28"}
  thecompaniesapi: {usd: 0.0019, basis: "Startup $95/mo / 50,000 credits (overage listed at $2.50 per 1,000 = $0.0025)", source: "https://www.thecompaniesapi.com/pricing", checked: "2026-07-28"}
  pdl: {usd: null, basis: "no per-credit price published; plans are sales-negotiated", note: "the public pricing page renders no rate card; third-party write-ups cite ~$0.28 per person-enrichment match on the ~$98/mo Pro tier, which is unverified and deliberately NOT used here", source: "https://www.peopledatalabs.com/pricing", checked: "2026-07-28"}
  apollo: {usd: null, basis: "seat-priced, not credit-priced", note: "plans are per-user per-month (~$49/user/mo Basic) and bundle three separate quotas -- email, export, and mobile credits -- so no single dollars-per-credit rate exists", source: "https://www.apollo.io/pricing", checked: "2026-07-28"}
  crunchbase: {usd: null, basis: "no published API pricing", note: "the Basic API was retired and remaining API access is quoted by sales; no credit unit is published", source: "https://data.crunchbase.com/docs/crunchbase-basic-getting-started", checked: "2026-07-28"}
  brightdata: {usd: null, basis: "not credit-priced", note: "billing is per record / per GB / per 1,000 results per product, with no cross-product credit unit, so costs stay in the provider's own units", source: "https://brightdata.com/pricing", checked: "2026-07-28"}
rates_to_usd:
  USD: 1.0
  CNY: 0.1476
updated: 2026-07-28
source: https://open.er-api.com/v6/latest/USD
