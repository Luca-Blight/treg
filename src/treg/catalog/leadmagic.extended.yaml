# leadmagic — EXTENDED tier: the rest of the documented v1/v3 surface not curated in leadmagic.yaml.
# LeadMagic publishes no fetchable OpenAPI document (per-endpoint reference pages only), so this file
# is hand-transcribed from https://leadmagic.io/docs/api-reference/* — one WebFetch per page, 2026-07-28.
# No credential was used; nothing here has been called (INGEST only — verification is a later step).
#
# Naming: LeadMagic's own reference-page slugs don't always match their path segments (the page
# "email-to-profile" documents /v1/people/b2b-profile; "profile-to-email" documents
# /v1/people/b2b-profile-email) — ids below follow the PATH, `name` follows the page's own title.
#
# Billing pattern holds across this tier too: most routes charge only on a definitive hit and are
# free on a miss/no-match. The three ad-search routes and jobs/company-search v3 charge PER ITEM
# returned instead (no free floor on the base call), and b2b-ads-search additionally reserves a
# base charge plus one credit per ad (1-51 credits for a single call) — flag this to a verifier
# before it runs unbounded.
#
# VERIFIED 2026-07-28 — 11 of 15 entries called live with a real credential under a 30-credit
# budget (observed spend ~9.3 credits total, core+extended combined): 10 passed and 1
# (competitors-search) 401s with invalid_api_key on this key, the same plan-gate shape as core's
# /v3/people/search — a different /v3 route (companies/search) on the SAME key succeeds, so it
# reads as a route-level feature gate rather than a broken key. The 3 ad-search routes
# (google-ads-search, meta-ads-search, b2b-ads-search) are `skipped`: none of them document a
# `limit` param, so a single call's cost is unbounded (b2b-ads-search alone can reach 51 credits)
# and none could be safely bounded within the 30-credit cap — they need a topped-up budget and
# the response's own X-Credits-Max-Cost header checked before a real run, not investigation.

provider: leadmagic
source:
  method: hand-curated from LeadMagic's official per-endpoint HTML reference (no OpenAPI document exists)
  ingested: '2026-07-28'
  spec_urls:
    - https://leadmagic.io/docs/v1/introduction
    - https://leadmagic.io/docs/api-reference/email-to-profile
    - https://leadmagic.io/docs/api-reference/profile-to-email
    - https://leadmagic.io/docs/api-reference/personal-email-finder
    - https://leadmagic.io/docs/api-reference/role-finder
    - https://leadmagic.io/docs/api-reference/employee-finder
    - https://leadmagic.io/docs/api-reference/job-change-detector
    - https://leadmagic.io/docs/api-reference/competitors-search
    - https://leadmagic.io/docs/api-reference/company-funding
    - https://leadmagic.io/docs/api-reference/technographics
    - https://leadmagic.io/docs/api-reference/company-search-v3
    - https://leadmagic.io/docs/api-reference/job-search
    - https://leadmagic.io/docs/api-reference/jobs-finder
    - https://leadmagic.io/docs/api-reference/google-ads-search
    - https://leadmagic.io/docs/api-reference/meta-ads-search
    - https://leadmagic.io/docs/api-reference/b2b-ads-search

endpoints:
  - id: leadmagic.x.b2b-profile
    tier: extended
    platform: people
    method: POST
    path: /v1/people/b2b-profile
    name: "Find a profile URL from an email (reverse lookup)"
    summary: "Performs reverse email lookup to identify professional profile URLs associated with work or personal email addresses"
    input:
      bodyType: json
      body:
        work_email: {type: string, required: false, example: "jane@leadmagic.io"}
        personal_email: {type: string, required: false}
      note: "at least one of work_email | personal_email is required"
    test_request:
      bodyType: json
      body: {work_email: "press@leadmagic.io"}
    cost:
      type: per_success
      value: null
      currency: USD
      note: "10 credits if a profile is found; free if not found"
    verified: 2026-07-28
    example_response: examples/leadmagic.x.b2b-profile.json
    docs_url: https://leadmagic.io/docs/api-reference/email-to-profile

  - id: leadmagic.x.b2b-profile-email
    tier: extended
    capability: people.email.find
    platform: people
    method: POST
    path: /v1/people/b2b-profile-email
    name: "Find a work email from a profile URL"
    summary: "Retrieves work email addresses from professional profiles by accepting a profile URL or username as input; every email found is automatically validated for deliverability"
    input:
      bodyType: json
      body:
        profile_url: {type: string, required: true, note: "full profile URL or just the username", example: "https://www.linkedin.com/in/example"}
    test_request:
      bodyType: json
      body: {profile_url: "https://www.linkedin.com/in/example"}
    cost:
      type: per_success
      value: null
      currency: USD
      note: "5 credits if an email is found; free if not found"
    verified: 2026-07-28
    example_response: examples/leadmagic.x.b2b-profile-email.json
    docs_url: https://leadmagic.io/docs/api-reference/profile-to-email

