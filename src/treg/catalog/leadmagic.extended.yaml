  - id: leadmagic.x.companies-search-v3
    tier: extended
    capability: companies.search
    platform: companies
    method: POST
    path: /v3/companies/search
    name: "Search companies by firmographics, tech, funding"
    summary: "The canonical company discovery endpoint supporting both single-company lookups and broad criteria-based discovery — domain, website, name, profile URL, and extensive firmographic/technographic/funding filters with cursor pagination"
    input:
      bodyType: json
      body:
        company_domain: {type: string, required: false, note: "single-company lookup", example: "leadmagic.io"}
        company_name: {type: string, required: false}
        linkedin_url: {type: string, required: false}
        industries: {type: "array[string]", required: false}
        min_employees: {type: integer, required: false}
        max_employees: {type: integer, required: false}
        country_codes: {type: "array[string]", required: false}
        tech_stack: {type: "array[string]", required: false}
        sort_by: {type: string, required: false, note: "linkedin_followers | total_funding | linkedin_employee_count | revenue_min | revenue_max | founded_year | total_contacts"}
        limit: {type: integer, required: false, note: "max 50", example: 1}
        cursor: {type: string, required: false, note: "opaque pagination token from a previous response"}
      note: "one-off lookup via company_domain/website/company_name/linkedin_url, OR broad discovery via the firmographic/technographic/funding filters; also nestable under company_filters (alias: filters)"
    test_request:
      bodyType: json
      body: {company_domain: "leadmagic.io", limit: 1}
    cost:
      type: per_result
      value: null
      currency: USD
      note: "1 credit per company returned; free if zero matches. Rate limit 100 req/min, ~2 req/s burst"
