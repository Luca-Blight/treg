    input:
      bodyType: json
      body:
        company_domain: {type: string, required: false, example: "leadmagic.io"}
        company_name: {type: string, required: false}
        limit: {type: integer, required: false, example: 1}
      note: "at least one of company_domain | company_name is required"
    test_request:
      bodyType: json
      body: {company_domain: "leadmagic.io", limit: 1}
    cost:
      type: per_result
      value: 0.05
      currency: USD
      note: "0.05 credits per employee returned (20 employees = 1 credit); free if no results"
    verified: 2026-07-28
    example_response: examples/leadmagic.x.employee-finder.json
    docs_url: https://leadmagic.io/docs/api-reference/employee-finder

