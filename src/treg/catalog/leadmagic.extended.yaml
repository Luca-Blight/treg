        company_name: {type: string, required: false}
        company_website: {type: string, required: false, example: "leadmagic.io"}
        min_employees: {type: integer, required: false}
        max_employees: {type: integer, required: false}
        has_remote: {type: boolean, required: false}
        location: {type: string, required: false}
        posted_within: {type: integer, required: false, note: "days", example: 30}
        page: {type: integer, required: false, example: 1}
        per_page: {type: integer, required: false, example: 1}
      note: "every field is optional — set per_page deliberately to control cost"
    test_request:
